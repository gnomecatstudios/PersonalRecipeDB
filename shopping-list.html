<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Shopping List</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#2c211b;--muted:#75645a;--accent:#914b2c;--soft:#f3dfcf;--line:#e2cfb8;--danger:#9a3028}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#f3e5cf);color:var(--ink);font-family:system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}header{padding:30px 0 20px}.hero,.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{box-shadow:0 20px 50px #57311618}h1,h2{font-family:Georgia,serif}h1{margin:0;font-size:clamp(2.2rem,7vw,4.4rem)}.muted{color:var(--muted)}.nav,.auth-actions,.row-actions{display:flex;gap:9px;flex-wrap:wrap}.button,button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:9px 13px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.7fr);gap:20px;padding-bottom:45px}.auth-panel{margin-bottom:20px}.auth-form{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;max-width:620px}.auth-form input,.manual-form input,.manual-form select,.filter-grid input,.filter-grid select,.edit-grid input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.status{margin:10px 0 0;font-weight:700}.recipe-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.recipe-option{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.recipe-option small{display:block;color:var(--muted)}input[type=search]{width:100%;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:999px;font:inherit}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:var(--soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:800}.manual-form{display:grid;grid-template-columns:minmax(170px,1fr) minmax(120px,.65fr) minmax(160px,.8fr) auto;gap:8px;margin:0 0 12px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff}.filters{margin:0 0 12px;border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden}.filters summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:800;color:var(--accent);display:flex;align-items:center;justify-content:space-between}.filters summary::-webkit-details-marker{display:none}.filters summary::after{content:'▾'}.filters[open] summary::after{content:'▴'}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;padding:0 14px 14px}.filter-grid label{display:grid;gap:5px;font-size:.82rem;font-weight:800;color:var(--muted)}.table-wrap{overflow:visible;border:1px solid var(--line);border-radius:15px;background:#fff}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#f7eadf}.check-col{width:36px}.ingredient-col{width:32%}.amount-col{width:22%}.from-col{width:24%}.actions-col{width:22%}.empty{padding:35px;text-align:center;color:var(--muted)}.bought td:not(:first-child){opacity:.45;text-decoration:line-through}.small{padding:5px 8px;font-size:.78rem}.edit-grid{display:grid;grid-template-columns:1fr;gap:8px}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.recipe-list{max-height:38vh}.manual-form{grid-template-columns:1fr 1fr}.manual-form button{grid-column:1/-1}.filter-grid{grid-template-columns:1fr}.table-wrap{overflow-x:auto}table{min-width:640px}}@media(max-width:560px){.manual-form,.auth-form{grid-template-columns:1fr}}@media print{.selector,.nav,.muted,.actions-col,.edit-grid,.filters,.manual-form,.auth-panel{display:none!important}.layout{display:block}.panel,.hero{border:0;box-shadow:none;padding:0}body{background:#fff}table{min-width:0;table-layout:auto}.amount-col{width:145px}.from-col{width:180px}}
</style>
</head>
<body>
<header class="wrap"><section class="hero"><h1>Shopping List</h1><p class="muted">Selected recipes are combined into one ingredient list. Sign in with the same email on each device to share the list.</p><nav class="nav"><a class="button" href="./">← Recipe Book</a><button id="print" class="button primary">Print</button><button id="clear" class="button danger" disabled>Clear List</button></nav></section></header>
<div class="wrap"><section class="panel auth-panel"><div id="signedOut"><h2>Sign in to sync</h2><form id="loginForm" class="auth-form"><input id="email" type="email" autocomplete="email" required placeholder="Your email address"><button class="primary" type="submit">Email Login Link</button></form></div><div id="signedIn" class="hidden"><div class="auth-actions"><strong id="account"></strong><button id="signOut" type="button">Sign Out</button></div></div><p id="syncStatus" class="status muted">Sign in to load your shared list.</p></section></div>
<main class="wrap layout"><section class="panel selector"><h2>Select Recipes</h2><input id="search" type="search" placeholder="Search recipes…"><div id="recipes" class="recipe-list"><div class="empty">Loading…</div></div></section><section class="panel"><h2>Your Ingredients</h2><form id="manualForm" class="manual-form"><input id="manualName" required placeholder="Ingredient name" aria-label="Ingredient name"><input id="manualAmount" placeholder="Amount, e.g. 2 cups" aria-label="Ingredient amount"><select id="manualType" aria-label="Ingredient type"><option>Produce</option><option>Meat & Seafood</option><option>Dairy & Eggs</option><option>Pantry</option><option>Baking</option><option>Spices & Seasonings</option><option>Canned & Jarred</option><option>Frozen</option><option selected>Other</option></select><button class="primary" type="submit" disabled>Add Ingredient</button></form><div id="summary" class="summary"></div><details id="filters" class="filters"><summary>Filters</summary><div class="filter-grid"><label>Recipe<select id="recipeFilter"><option value="all">All selected recipes</option></select></label><label>Ingredient<input id="ingredientFilter" type="search" placeholder="Search ingredients…"></label><label>Ingredient type<select id="typeFilter"><option value="all">All ingredient types</option><option>Produce</option><option>Meat & Seafood</option><option>Dairy & Eggs</option><option>Pantry</option><option>Baking</option><option>Spices & Seasonings</option><option>Canned & Jarred</option><option>Frozen</option><option>Other</option></select></label></div></details><div id="list"><div class="empty">Sign in to load your shopping list.</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://seaadqpniwtfcrapeepw.supabase.co';
const SUPABASE_KEY='sb_publishable_UMrA0peLcE5Fx8iW7D_FYg_d22oxXdI';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function localJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
const state={recipes:[],selected:new Set(),removed:new Set(),edits:{},manual:[],checked:new Set(),typeFilter:localStorage.getItem('shoppingTypeFilter')||'all',recipeFilter:localStorage.getItem('shoppingRecipeFilter')||'all',ingredientFilter:localStorage.getItem('shoppingIngredientFilter')||'',user:null,ready:false,saving:false,saveTimer:null};
function setStatus(message){$('#syncStatus').textContent=message}
function setEnabled(enabled){document.querySelectorAll('.recipe-option input,#manualForm button,#manualForm input,#manualForm select').forEach(x=>x.disabled=!enabled);$('#clear').disabled=!enabled}
function payload(){return{selected:[...state.selected],removed:[...state.removed],edits:state.edits,manual:state.manual,checked:[...state.checked]}}
function applyPayload(data={}){state.selected=new Set(data.selected||[]);state.removed=new Set(data.removed||[]);state.edits=data.edits||{};state.manual=data.manual||[];state.checked=new Set(data.checked||[])}
function localPayload(){return{selected:localJson('shoppingRecipes',[]),removed:localJson('shoppingRemovedIngredients',[]),edits:localJson('shoppingIngredientEdits',{}),manual:localJson('shoppingManualIngredients',[]),checked:localJson('shoppingCheckedIngredients',[])}}
function hasLocalData(data){return data.selected.length||data.removed.length||Object.keys(data.edits).length||data.manual.length||data.checked.length}
function clearLegacyLocal(){['shoppingRecipes','shoppingRemovedIngredients','shoppingIngredientEdits','shoppingManualIngredients','shoppingCheckedIngredients'].forEach(k=>localStorage.removeItem(k))}
async function saveShared(){if(!state.user||!state.ready)return;state.saving=true;setStatus('Saving…');const{error}=await db.from('shopping_lists').upsert({user_id:state.user.id,list_data:payload()},{onConflict:'user_id'});state.saving=false;if(error){console.error(error);setStatus(`Could not save: ${error.message}`)}else setStatus('Saved and shared across devices.')}
function queueSave(){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(saveShared,350)}
function saveFilters(){localStorage.setItem('shoppingTypeFilter',state.typeFilter);localStorage.setItem('shoppingRecipeFilter',state.recipeFilter);localStorage.setItem('shoppingIngredientFilter',state.ingredientFilter)}
async function loadShared(){state.ready=false;setEnabled(false);setStatus('Loading shared list…');const{data,error}=await db.from('shopping_lists').select('list_data,updated_at').eq('user_id',state.user.id).maybeSingle();if(error){setStatus(`Could not load: ${error.message}`);return}if(data){applyPayload(data.list_data);setStatus('Shared list loaded.')}else{const old=localPayload();applyPayload(old);state.ready=true;await saveShared();if(hasLocalData(old)){clearLegacyLocal();setStatus('Your existing device list was moved to Supabase.')}else setStatus('New shared shopping list created.')}state.ready=true;setEnabled(true);renderRecipes($('#search').value);renderList();handleIncomingRecipes()}
function handleIncomingRecipes(){if(!state.ready)return;const incoming=new URLSearchParams(location.search).get('recipes');if(!incoming)return;let changed=false;incoming.split(',').filter(Boolean).forEach(id=>{if(!state.selected.has(id)){state.selected.add(id);changed=true}});if(changed){queueSave();renderRecipes($('#search').value);renderList()}}
async function updateAuth(user){state.user=user||null;$('#signedOut').classList.toggle('hidden',!!user);$('#signedIn').classList.toggle('hidden',!user);$('#account').textContent=user?.email||'';if(user)await loadShared();else{state.ready=false;applyPayload({});setEnabled(false);renderRecipes($('#search').value);$('#list').innerHTML='<div class="empty">Sign in to load your shopping list.</div>';setStatus('Sign in to load your shared list.')}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim();setStatus('Sending login link…');const{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://gnomecatstudios.github.io/PersonalRecipeDB/shopping-list.html'}});setStatus(error?`Could not send link: ${error.message}`:'Check your email and open the login link.')};
$('#signOut').onclick=async()=>{await db.auth.signOut()};
db.auth.onAuthStateChange((_event,session)=>setTimeout(()=>updateAuth(session?.user||null),0));
function ingredientLines(md){let inside=false,out=[];for(const raw of md.split('\n')){const line=raw.trim();if(/^##\s+Ingredients/i.test(line)){inside=true;continue}if(inside&&/^##\s+/.test(line))break;if(inside&&/^[-*]\s+/.test(line))out.push(line.replace(/^[-*]\s+/,'').replace(/\*\*/g,'').trim())}return out}
function classify(name){const n=name.toLowerCase();if(/\b(carrot|onion|garlic|apple|lemon|lime|orange|parsley|cilantro|basil|potato|tomato|cucumber|cabbage|zucchini|squash|pepper|mushroom|celery|spinach|lettuce|corn|avocado|ginger|shallot|scallion|herb|zest)\b/.test(n))return'Produce';if(/\b(chicken|beef|pork|sausage|shrimp|salmon|tuna|fish|turkey|bacon|ham|steak|meat)\b/.test(n))return'Meat & Seafood';if(/\b(egg|milk|cream|butter|cheese|yogurt|ricotta|cottage cheese|parmesan|mozzarella)\b/.test(n))return'Dairy & Eggs';if(/\b(flour|sugar|oats|baking powder|baking soda|yeast|cocoa|chocolate|vanilla|cornstarch|extract)\b/.test(n))return'Baking';if(/\b(salt|pepper|seasoning|spice|cinnamon|oregano|rosemary|thyme|paprika|cumin|chili powder|garlic powder|onion powder|nutmeg)\b/.test(n))return'Spices & Seasonings';if(/\b(canned|can of|beans|broth|stock|tomato paste|diced tomatoes|jarred|sauce)\b/.test(n))return'Canned & Jarred';if(/\b(frozen|ice cream)\b/.test(n))return'Frozen';if(/\b(rice|pasta|oil|vinegar|bread|tortilla|peanut butter|nuts|seeds|honey|syrup|mustard|mayonnaise|mayo)\b/.test(n))return'Pantry';return'Other'}
function parse(line,r){const clean=line.replace(/^[–—-]+\s*/,'').trim();const qty='(?:\\d+(?:\\.\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+)';const packageMatch=clean.match(new RegExp(`^(${qty})\\s*\\(([^)]+)\\)\\s*(cans?|packages?|pkgs?|bags?|boxes?|jars?|bottles?)\\s+(.+)$`,'i'));let amount='',name=clean;if(packageMatch){amount=`${packageMatch[1]} × ${packageMatch[2]} ${packageMatch[3]}`;name=packageMatch[4].trim()}else{const units='(?:g|kg|mg|ml|l|oz|lb|lbs|pounds?|cups?|cup|tbsp|tablespoons?|tsp|teaspoons?|cloves?|cans?|packages?|pkgs?|bags?|boxes?|jars?|bottles?|large|small|medium)';const m=clean.match(new RegExp(`^(${qty})(?:\\s*[–—-]\\s*(${qty}))?\\s*(${units})?\\b\\s*(.*)$`,'i'));if(m){amount=[m[1],m[2]?`–${m[2]}`:'',m[3]||''].filter(Boolean).join(' ').trim();name=(m[4]||'').replace(/^of\s+/i,'').trim()}}if(/^(seasoning|seasoning mix|spice mix)(?:\s+of\s+choice)?$/i.test(name)){name='Seasoning mix of choice';if(!amount)amount='To taste'}if(!name)name=clean;const key=name.toLowerCase().replace(/\([^)]*\)/g,'').replace(/,?\s+for\s+(topping|serving|garnish)$/i,'').replace(/\b(finely|diced|chopped|shredded|minced|toasted|roughly)\b/g,'').replace(/\s+/g,' ').trim();return{name,amount,recipe:r.title,key:key||name.toLowerCase(),type:classify(name)}}
function aggregate(rows){const map=new Map();for(const x of rows){if(!map.has(x.key))map.set(x.key,{...x,amounts:[],recipes:new Set(),manualIds:new Set()});const a=map.get(x.key);if(x.amount)a.amounts.push(x.amount);a.recipes.add(x.recipe);if(x.manualId)a.manualIds.add(x.manualId)}return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
async function hydrate(r){try{return{...r,markdown:await(await fetch(`${r.file}?v=${Date.now()}`,{cache:'no-store'})).text()}}catch{return{...r,markdown:''}}}
function renderRecipes(q=''){const list=state.recipes.filter(r=>`${r.id} ${r.title}`.toLowerCase().includes(q.toLowerCase()));$('#recipes').innerHTML=list.map(r=>`<label class="recipe-option"><input type="checkbox" data-id="${esc(r.id)}" ${state.selected.has(r.id)?'checked':''} ${state.ready?'':'disabled'}><span><strong>${esc(r.title)}</strong><small>${esc(r.id)}</small></span></label>`).join('')||'<div class="empty">No matching recipes.</div>';document.querySelectorAll('.recipe-option input').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id);queueSave();renderList()})}
function itemId(x){return x.key.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function editItem(id){document.querySelectorAll(`[data-display="${id}"]`).forEach(x=>x.classList.add('hidden'));document.querySelectorAll(`[data-editor="${id}"]`).forEach(x=>x.classList.remove('hidden'))}
function cancelEdit(id){document.querySelectorAll(`[data-editor="${id}"]`).forEach(x=>x.classList.add('hidden'));document.querySelectorAll(`[data-display="${id}"]`).forEach(x=>x.classList.remove('hidden'))}
function saveEdit(id,key){state.edits[key]={name:document.querySelector(`[data-name="${id}"]`).value.trim(),amount:document.querySelector(`[data-amount="${id}"]`).value.trim()};queueSave();renderList()}
function removeItem(key){state.removed.add(key);state.checked.delete(key);queueSave();renderList()}
function deleteManual(ids){const set=new Set(ids.split(',').filter(Boolean));state.manual=state.manual.filter(x=>!set.has(x.id));set.forEach(id=>state.checked.delete(`manual-${id}`));queueSave();renderList()}
function toggleChecked(key,checked){checked?state.checked.add(key):state.checked.delete(key);queueSave()}
function refreshRecipeFilter(chosen){const available=new Set(chosen.map(r=>r.title));if(state.manual.length)available.add('Manually added');if(state.recipeFilter!=='all'&&!available.has(state.recipeFilter))state.recipeFilter='all';$('#recipeFilter').innerHTML='<option value="all">All selected recipes</option>'+[...available].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('#recipeFilter').value=state.recipeFilter}
function renderList(){if(!state.ready){$('#summary').innerHTML='';return}const chosen=state.recipes.filter(r=>state.selected.has(r.id)),recipeRows=chosen.flatMap(r=>ingredientLines(r.markdown).map(x=>parse(x,r))),manualRows=state.manual.map(x=>({name:x.name,amount:x.amount,recipe:'Manually added',key:`manual-${x.id}`,type:x.type,manualId:x.id})),all=aggregate([...recipeRows,...manualRows]),visible=all.filter(x=>!state.removed.has(x.key));refreshRecipeFilter(chosen);const needle=state.ingredientFilter.trim().toLowerCase();const items=visible.filter(x=>(state.typeFilter==='all'||x.type===state.typeFilter)&&(state.recipeFilter==='all'||x.recipes.has(state.recipeFilter))&&(!needle||x.name.toLowerCase().includes(needle)));$('#summary').innerHTML=`<span class="pill">${chosen.length} recipe${chosen.length===1?'':'s'}</span><span class="pill">${visible.length} ingredient${visible.length===1?'':'s'}</span>`;if(!visible.length){$('#list').innerHTML='<div class="empty">No ingredients yet. Select a recipe or add one manually.</div>';return}if(!items.length){$('#list').innerHTML='<div class="empty">No ingredients match the current filters.</div>';return}$('#list').innerHTML=`<div class="table-wrap"><table><thead><tr><th class="check-col"></th><th class="ingredient-col">Ingredient</th><th class="amount-col">Amount</th><th class="from-col">From</th><th class="actions-col">Actions</th></tr></thead><tbody>${items.map(x=>{const id=itemId(x),edit=state.edits[x.key]||{},name=edit.name||x.name,amount=edit.amount||[...new Set(x.amounts)].join(' + ')||'—',manualIds=[...x.manualIds].join(','),checked=state.checked.has(x.key);return`<tr class="${checked?'bought':''}"><td><input type="checkbox" ${checked?'checked':''} onchange="this.closest('tr').classList.toggle('bought',this.checked);toggleChecked('${esc(x.key)}',this.checked)"></td><td><div data-display="${id}"><strong>${esc(name)}</strong><small class="muted">${esc(x.type)}</small></div><div class="edit-grid hidden" data-editor="${id}"><input data-name="${id}" value="${esc(name)}"><input data-amount="${id}" value="${esc(amount)}"></div></td><td><span data-display="${id}">${esc(amount)}</span></td><td>${esc([...x.recipes].join(', '))}</td><td class="actions-col"><div data-display="${id}" class="row-actions"><button class="small" onclick="editItem('${id}')">Edit</button>${manualIds?`<button class="small danger" onclick="deleteManual('${manualIds}')">Delete</button>`:`<button class="small danger" onclick="removeItem('${esc(x.key)}')">Remove</button>`}</div><div data-editor="${id}" class="row-actions hidden"><button class="small primary" onclick="saveEdit('${id}','${esc(x.key)}')">Save</button><button class="small" onclick="cancelEdit('${id}')">Cancel</button></div></td></tr>`}).join('')}</tbody></table></div>`}
$('#manualForm').onsubmit=e=>{e.preventDefault();if(!state.ready)return;const name=$('#manualName').value.trim(),amount=$('#manualAmount').value.trim(),type=$('#manualType').value;if(!name)return;state.manual.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name,amount,type});queueSave();e.target.reset();$('#manualType').value='Other';renderList();$('#manualName').focus()};
$('#search').oninput=e=>renderRecipes(e.target.value);$('#typeFilter').value=state.typeFilter;$('#ingredientFilter').value=state.ingredientFilter;$('#typeFilter').onchange=e=>{state.typeFilter=e.target.value;saveFilters();renderList()};$('#recipeFilter').onchange=e=>{state.recipeFilter=e.target.value;saveFilters();renderList()};$('#ingredientFilter').oninput=e=>{state.ingredientFilter=e.target.value;saveFilters();renderList()};$('#print').onclick=()=>window.print();$('#clear').onclick=()=>{if(!state.ready||!confirm('Clear the shared shopping list on every device?'))return;applyPayload({});queueSave();renderRecipes($('#search').value);renderList()};
fetch(`recipes/index.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(async d=>{state.recipes=await Promise.all(d.map(hydrate));renderRecipes();renderList()}).catch(()=>{$('#recipes').innerHTML='<div class="empty">Could not load recipes.</div>'});
db.auth.getSession().then(({data})=>updateAuth(data.session?.user||null));
</script>
</body>
</html>
