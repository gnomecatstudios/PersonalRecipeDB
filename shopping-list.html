<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Shopping List</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#2c211b;--muted:#75645a;--accent:#914b2c;--soft:#f3dfcf;--line:#e2cfb8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#f3e5cf);color:var(--ink);font-family:system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}header{padding:30px 0 20px}.hero,.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{box-shadow:0 20px 50px #57311618}h1,h2{font-family:Georgia,serif}h1{margin:0;font-size:clamp(2.2rem,7vw,4.4rem)}.muted{color:var(--muted)}.nav,.toolbar{display:flex;gap:9px;flex-wrap:wrap}.button,button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:10px 15px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.5fr);gap:20px;padding-bottom:45px}.recipe-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.recipe-option{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.recipe-option small{display:block;color:var(--muted)}input[type=search]{width:100%;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:999px;font:inherit}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:var(--soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:800}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f7eadf}.empty{padding:35px;text-align:center;color:var(--muted)}.bought td:not(:first-child){opacity:.45;text-decoration:line-through}
@media(max-width:800px){.layout{grid-template-columns:1fr}.recipe-list{max-height:38vh}}@media print{.selector,.nav,.muted{display:none!important}.layout{display:block}.panel,.hero{border:0;box-shadow:none;padding:0}body{background:#fff}table{min-width:0}}
</style></head><body>
<header class="wrap"><section class="hero"><h1>Shopping List</h1><p class="muted">Selected recipes are combined into one ingredient list.</p><nav class="nav"><a class="button" href="./">← Recipe Book</a><button id="print" class="button primary">Print</button><button id="clear" class="button">Clear List</button></nav></section></header>
<main class="wrap layout"><section class="panel selector"><h2>Select Recipes</h2><input id="search" type="search" placeholder="Search recipes…"><div id="recipes" class="recipe-list"><div class="empty">Loading…</div></div></section><section class="panel"><h2>Your Ingredients</h2><div id="summary" class="summary"></div><div id="list"><div class="empty">No recipes selected.</div></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function stored(){try{return new Set(JSON.parse(localStorage.getItem('shoppingRecipes')||'[]'))}catch{return new Set()}}
const state={recipes:[],selected:stored()};
const incoming=new URLSearchParams(location.search).get('recipes');if(incoming){incoming.split(',').filter(Boolean).forEach(id=>state.selected.add(id));localStorage.setItem('shoppingRecipes',JSON.stringify([...state.selected]))}
function save(){localStorage.setItem('shoppingRecipes',JSON.stringify([...state.selected]))}
function ingredientLines(md){let inside=false,out=[];for(const raw of md.split('\n')){const line=raw.trim();if(/^##\s+Ingredients/i.test(line)){inside=true;continue}if(inside&&/^##\s+/.test(line))break;if(inside&&/^[-*]\s+/.test(line))out.push(line.replace(/^[-*]\s+/,'').replace(/\*\*/g,'').trim())}return out}
function parse(line,r){const m=line.match(/^([\d.]+(?:\s+\d+\/\d+)?|\d+\/\d+)(?:\s*[–—-]\s*([\d.]+(?:\s+\d+\/\d+)?|\d+\/\d+))?\s*(g|kg|mg|ml|l|oz|lb|lbs|pounds?|cups?|cup|tbsp|tablespoons?|tsp|teaspoons?)?\s*(.*)$/i);let name=line;if(m)name=(m[4]||line).replace(/^of\s+/i,'').trim();return{name:name||line,original:line,recipe:r.title,key:(name||line).toLowerCase().replace(/\b(finely|diced|chopped|shredded|minced|toasted|roughly|large|small)\b/g,'').replace(/\s+/g,' ').trim()}}
function aggregate(rows){const map=new Map();for(const x of rows){if(!map.has(x.key))map.set(x.key,{...x,originals:[],recipes:new Set()});const a=map.get(x.key);a.originals.push(x.original);a.recipes.add(x.recipe)}return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
async function hydrate(r){try{return{...r,markdown:await (await fetch(`${r.file}?v=${Date.now()}`,{cache:'no-store'})).text()}}catch{return{...r,markdown:''}}}
function renderRecipes(q=''){const list=state.recipes.filter(r=>`${r.id} ${r.title}`.toLowerCase().includes(q.toLowerCase()));$('#recipes').innerHTML=list.map(r=>`<label class="recipe-option"><input type="checkbox" data-id="${esc(r.id)}" ${state.selected.has(r.id)?'checked':''}><span><strong>${esc(r.title)}</strong><small>${esc(r.id)}</small></span></label>`).join('')||'<div class="empty">No matching recipes.</div>';document.querySelectorAll('.recipe-option input').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id);save();renderList()})}
function renderList(){const chosen=state.recipes.filter(r=>state.selected.has(r.id)),items=aggregate(chosen.flatMap(r=>ingredientLines(r.markdown).map(x=>parse(x,r))));$('#summary').innerHTML=`<span class="pill">${chosen.length} recipe${chosen.length===1?'':'s'}</span><span class="pill">${items.length} ingredient${items.length===1?'':'s'}</span>`;if(!chosen.length){$('#list').innerHTML='<div class="empty">No recipes selected.</div>';return}if(!items.length){$('#list').innerHTML='<div class="empty">The selected recipe has no Ingredients section to import.</div>';return}$('#list').innerHTML=`<div class="table-wrap"><table><thead><tr><th></th><th>Ingredient</th><th>Amount</th><th>From</th></tr></thead><tbody>${items.map(x=>`<tr><td><input type="checkbox" onchange="this.closest('tr').classList.toggle('bought',this.checked)"></td><td><strong>${esc(x.name)}</strong></td><td>${esc([...new Set(x.originals)].join(' + '))}</td><td>${esc([...x.recipes].join(', '))}</td></tr>`).join('')}</tbody></table></div>`}
$('#search').oninput=e=>renderRecipes(e.target.value);$('#print').onclick=()=>window.print();$('#clear').onclick=()=>{state.selected.clear();save();renderRecipes($('#search').value);renderList()};
fetch(`recipes/index.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(async d=>{state.recipes=await Promise.all(d.map(hydrate));renderRecipes();renderList()}).catch(()=>$('#recipes').innerHTML='<div class="empty">Could not load recipes.</div>');
</script></body></html>
