<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Shopping List</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#2c211b;--muted:#75645a;--accent:#914b2c;--soft:#f3dfcf;--line:#e2cfb8;--danger:#9a3028}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#f3e5cf);color:var(--ink);font-family:system-ui,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}header{padding:30px 0 20px}.hero,.panel{background:#ffffffd9;border:1px solid var(--line);border-radius:24px;padding:26px}.hero{box-shadow:0 20px 50px #57311618}h1,h2{font-family:Georgia,serif}h1{margin:0;font-size:clamp(2.2rem,7vw,4.4rem)}.muted{color:var(--muted)}.nav{display:flex;gap:9px;flex-wrap:wrap}.button,button{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:9px 13px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}.layout{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.7fr);gap:20px;padding-bottom:45px}.recipe-list{display:grid;gap:8px;max-height:65vh;overflow:auto}.recipe-option{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.recipe-option small{display:block;color:var(--muted)}input[type=search]{width:100%;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:999px;font:inherit}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:var(--soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:800}.filter-bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 12px}.filter-bar label{display:grid;gap:5px;font-size:.82rem;font-weight:800;color:var(--muted)}.filter-bar select{min-width:210px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit}.table-wrap{overflow:visible;border:1px solid var(--line);border-radius:15px;background:#fff}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}th{background:#f7eadf}.check-col{width:36px}.ingredient-col{width:32%}.amount-col{width:22%}.from-col{width:24%}.actions-col{width:22%}.empty{padding:35px;text-align:center;color:var(--muted)}.bought td:not(:first-child){opacity:.45;text-decoration:line-through}.row-actions{display:flex;gap:5px;flex-wrap:wrap}.small{padding:5px 8px;font-size:.78rem}.edit-grid{display:grid;grid-template-columns:1fr;gap:8px}.edit-grid input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font:inherit}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}.recipe-list{max-height:38vh}.table-wrap{overflow-x:auto}table{min-width:640px}}@media print{.selector,.nav,.muted,.actions-col,.edit-grid,.filter-bar{display:none!important}.layout{display:block}.panel,.hero{border:0;box-shadow:none;padding:0}body{background:#fff}table{min-width:0;table-layout:auto}.amount-col{width:145px}.from-col{width:180px}}
</style></head><body>
<header class="wrap"><section class="hero"><h1>Shopping List</h1><p class="muted">Selected recipes are combined into one ingredient list. Edit or remove individual items as needed.</p><nav class="nav"><a class="button" href="./">← Recipe Book</a><button id="print" class="button primary">Print</button><button id="restore" class="button">Restore Removed Items</button><button id="clear" class="button danger">Clear List</button></nav></section></header>
<main class="wrap layout"><section class="panel selector"><h2>Select Recipes</h2><input id="search" type="search" placeholder="Search recipes…"><div id="recipes" class="recipe-list"><div class="empty">Loading…</div></div></section><section class="panel"><h2>Your Ingredients</h2><div id="summary" class="summary"></div><div class="filter-bar"><label>Filter by type<select id="typeFilter"><option value="all">All ingredients</option><option>Produce</option><option>Meat & Seafood</option><option>Dairy & Eggs</option><option>Pantry</option><option>Baking</option><option>Spices & Seasonings</option><option>Canned & Jarred</option><option>Frozen</option><option>Other</option></select></label></div><div id="list"><div class="empty">No recipes selected.</div></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function jsonStore(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
function stored(){return new Set(jsonStore('shoppingRecipes',[]))}
const state={recipes:[],selected:stored(),removed:new Set(jsonStore('shoppingRemovedIngredients',[])),edits:jsonStore('shoppingIngredientEdits',{}),typeFilter:localStorage.getItem('shoppingTypeFilter')||'all'};
const incoming=new URLSearchParams(location.search).get('recipes');if(incoming){incoming.split(',').filter(Boolean).forEach(id=>state.selected.add(id));localStorage.setItem('shoppingRecipes',JSON.stringify([...state.selected]))}
function save(){localStorage.setItem('shoppingRecipes',JSON.stringify([...state.selected]));localStorage.setItem('shoppingRemovedIngredients',JSON.stringify([...state.removed]));localStorage.setItem('shoppingIngredientEdits',JSON.stringify(state.edits));localStorage.setItem('shoppingTypeFilter',state.typeFilter)}
function ingredientLines(md){let inside=false,out=[];for(const raw of md.split('\n')){const line=raw.trim();if(/^##\s+Ingredients/i.test(line)){inside=true;continue}if(inside&&/^##\s+/.test(line))break;if(inside&&/^[-*]\s+/.test(line))out.push(line.replace(/^[-*]\s+/,'').replace(/\*\*/g,'').trim())}return out}
function classify(name){const n=name.toLowerCase();if(/\b(carrot|onion|garlic|apple|lemon|lime|orange|parsley|cilantro|basil|potato|tomato|cucumber|cabbage|zucchini|squash|pepper|mushroom|celery|spinach|lettuce|corn|avocado|ginger|shallot|scallion|herb|zest)\b/.test(n))return'Produce';if(/\b(chicken|beef|pork|sausage|shrimp|salmon|tuna|fish|turkey|bacon|ham|steak|meat)\b/.test(n))return'Meat & Seafood';if(/\b(egg|milk|cream|butter|cheese|yogurt|ricotta|cottage cheese|parmesan|mozzarella)\b/.test(n))return'Dairy & Eggs';if(/\b(flour|sugar|oats|baking powder|baking soda|yeast|cocoa|chocolate|vanilla|cornstarch|extract)\b/.test(n))return'Baking';if(/\b(salt|pepper|seasoning|spice|cinnamon|oregano|rosemary|thyme|paprika|cumin|chili powder|garlic powder|onion powder|nutmeg)\b/.test(n))return'Spices & Seasonings';if(/\b(canned|can of|beans|broth|stock|tomato paste|diced tomatoes|jarred|sauce)\b/.test(n))return'Canned & Jarred';if(/\b(frozen|ice cream)\b/.test(n))return'Frozen';if(/\b(rice|pasta|oil|vinegar|bread|tortilla|peanut butter|nuts|seeds|honey|syrup|mustard|mayonnaise|mayo)\b/.test(n))return'Pantry';return'Other'}
function parse(line,r){const clean=line.replace(/^[–—-]+\s*/,'').trim();const qty='(?:\\d+(?:\\.\\d+)?(?:\\s+\\d+\\/\\d+)?|\\d+\\/\\d+)';const packageMatch=clean.match(new RegExp(`^(${qty})\\s*\\(([^)]+)\\)\\s*(cans?|packages?|pkgs?|bags?|boxes?|jars?|bottles?)\\s+(.+)$`,'i'));let amount='',name=clean;if(packageMatch){amount=`${packageMatch[1]} × ${packageMatch[2]} ${packageMatch[3]}`;name=packageMatch[4].trim()}else{const units='(?:g|kg|mg|ml|l|oz|lb|lbs|pounds?|cups?|cup|tbsp|tablespoons?|tsp|teaspoons?|cloves?|cans?|packages?|pkgs?|bags?|boxes?|jars?|bottles?|large|small|medium)';const m=clean.match(new RegExp(`^(${qty})(?:\\s*[–—-]\\s*(${qty}))?\\s*(${units})?\\b\\s*(.*)$`,'i'));if(m){amount=[m[1],m[2]?`–${m[2]}`:'',m[3]||''].filter(Boolean).join(' ').trim();name=(m[4]||'').replace(/^of\s+/i,'').trim();if(!name&&m[3]&&/^(large|small|medium)$/i.test(m[3])){name=m[3];amount=[m[1],m[2]?`–${m[2]}`:''].filter(Boolean).join(' ').trim()}}}
if(/^(seasoning|seasoning mix|spice mix)(?:\s+of\s+choice)?$/i.test(name)){name='Seasoning mix of choice';if(!amount)amount='To taste'}
if(!name)name=clean;const key=name.toLowerCase().replace(/\([^)]*\)/g,'').replace(/,?\s+for\s+(topping|serving|garnish)$/i,'').replace(/\b(finely|diced|chopped|shredded|minced|toasted|roughly)\b/g,'').replace(/\s+/g,' ').trim();return{name,amount,original:clean,recipe:r.title,key:key||name.toLowerCase(),type:classify(name)}}
function aggregate(rows){const map=new Map();for(const x of rows){if(!map.has(x.key))map.set(x.key,{...x,amounts:[],recipes:new Set()});const a=map.get(x.key);if(x.amount)a.amounts.push(x.amount);a.recipes.add(x.recipe)}return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
async function hydrate(r){try{return{...r,markdown:await (await fetch(`${r.file}?v=${Date.now()}`,{cache:'no-store'})).text()}}catch{return{...r,markdown:''}}}
function renderRecipes(q=''){const list=state.recipes.filter(r=>`${r.id} ${r.title}`.toLowerCase().includes(q.toLowerCase()));$('#recipes').innerHTML=list.map(r=>`<label class="recipe-option"><input type="checkbox" data-id="${esc(r.id)}" ${state.selected.has(r.id)?'checked':''}><span><strong>${esc(r.title)}</strong><small>${esc(r.id)}</small></span></label>`).join('')||'<div class="empty">No matching recipes.</div>';document.querySelectorAll('.recipe-option input').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id);save();renderList()})}
function itemId(x){return x.key.replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function editItem(id){document.querySelector(`[data-display="${id}"]`).classList.add('hidden');document.querySelector(`[data-editor="${id}"]`).classList.remove('hidden')}
function cancelEdit(id){document.querySelector(`[data-editor="${id}"]`).classList.add('hidden');document.querySelector(`[data-display="${id}"]`).classList.remove('hidden')}
function saveEdit(id,key){const name=document.querySelector(`[data-name="${id}"]`).value.trim(),amount=document.querySelector(`[data-amount="${id}"]`).value.trim();state.edits[key]={name,amount};save();renderList()}
function removeItem(key){state.removed.add(key);save();renderList()}
function renderList(){const chosen=state.recipes.filter(r=>state.selected.has(r.id)),all=aggregate(chosen.flatMap(r=>ingredientLines(r.markdown).map(x=>parse(x,r)))),visible=all.filter(x=>!state.removed.has(x.key)),items=state.typeFilter==='all'?visible:visible.filter(x=>x.type===state.typeFilter);$('#summary').innerHTML=`<span class="pill">${chosen.length} recipe${chosen.length===1?'':'s'}</span><span class="pill">${visible.length} ingredient${visible.length===1?'':'s'}</span>${state.typeFilter!=='all'?`<span class="pill">${items.length} shown</span>`:''}${state.removed.size?`<span class="pill">${state.removed.size} removed</span>`:''}`;if(!chosen.length){$('#list').innerHTML='<div class="empty">No recipes selected.</div>';return}if(!visible.length){$('#list').innerHTML='<div class="empty">No ingredients remain. Use “Restore Removed Items” to bring them back.</div>';return}if(!items.length){$('#list').innerHTML='<div class="empty">No ingredients match this type.</div>';return}$('#list').innerHTML=`<div class="table-wrap"><table><thead><tr><th class="check-col"></th><th class="ingredient-col">Ingredient</th><th class="amount-col">Amount</th><th class="from-col">From</th><th class="actions-col">Actions</th></tr></thead><tbody>${items.map(x=>{const id=itemId(x),edit=state.edits[x.key]||{},name=edit.name||x.name,amount=edit.amount||[...new Set(x.amounts)].join(' + ')||'—';return`<tr><td><input type="checkbox" onchange="this.closest('tr').classList.toggle('bought',this.checked)"></td><td><div data-display="${id}"><strong>${esc(name)}</strong><small class="muted">${esc(x.type)}</small></div><div class="edit-grid hidden" data-editor="${id}"><input data-name="${id}" value="${esc(name)}" aria-label="Ingredient name"><input data-amount="${id}" value="${esc(amount)}" aria-label="Ingredient amount"></div></td><td><span data-display="${id}">${esc(amount)}</span></td><td>${esc([...x.recipes].join(', '))}</td><td class="actions-col"><div data-display="${id}" class="row-actions"><button class="small" onclick="editItem('${id}')">Edit</button><button class="small danger" onclick="removeItem('${esc(x.key)}')">Remove</button></div><div data-editor="${id}" class="row-actions hidden"><button class="small primary" onclick="saveEdit('${id}','${esc(x.key)}')">Save</button><button class="small" onclick="cancelEdit('${id}')">Cancel</button></div></td></tr>`}).join('')}</tbody></table></div>`}
$('#search').oninput=e=>renderRecipes(e.target.value);$('#typeFilter').value=state.typeFilter;$('#typeFilter').onchange=e=>{state.typeFilter=e.target.value;save();renderList()};$('#print').onclick=()=>window.print();$('#restore').onclick=()=>{state.removed.clear();save();renderList()};$('#clear').onclick=()=>{state.selected.clear();state.removed.clear();state.edits={};state.typeFilter='all';save();$('#typeFilter').value='all';renderRecipes($('#search').value);renderList()};
fetch(`recipes/index.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(async d=>{state.recipes=await Promise.all(d.map(hydrate));renderRecipes();renderList()}).catch(()=>$('#recipes').innerHTML='<div class="empty">Could not load recipes.</div>');
</script></body></html>
