eight:24px;margin:0}td:nth-child(2){grid-area:name}td:nth-child(2) strong{display:block;font-size:1.05rem;line-height:1.18;overflow-wrap:anywhere}td:nth-child(2) small{display:none}td:nth-child(3){grid-area:meta;font-size:.8rem;font-weight:700;color:var(--accent)}td:nth-child(3)::after{content:' · ' attr(data-type);font-weight:600;color:var(--muted)}td:nth-child(4){grid-area:from;font-size:.76rem;line-height:1.2;color:var(--muted);padding-top:1px}td:nth-child(4)::before{content:'From: ';font-weight:700}td:nth-child(5){grid-area:actions;align-self:center;padding:0}.row-actions{display:flex;flex-direction:column;flex-wrap:nowrap;gap:5px;width:auto}.row-actions button{flex:none;min-width:66px;min-height:34px;padding:6px 9px;font-size:.76rem;white-space:nowrap}.edit-grid{grid-column:1/-1;gap:7px}.empty{padding:22px 10px}.bought{background:#f7f2eb}.bought td:not(:first-child){opacity:.5}}

@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{width:auto!important;min-width:0!important;background:#fff!important;color:#000!important;font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;line-height:1.08}.selector,.nav,.muted,.actions-col,.edit-grid,.filters,.manual-form,.auth-panel,.summary,.from-col,thead{display:none!important}.wrap{width:100%!important;margin:0!important}header{padding:0 0 7pt!important}.layout{display:block!important;padding:0!important}.panel,.hero{border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;background:#fff!important}.hero h1{font-family:Arial,Helvetica,sans-serif;font-size:18pt;line-height:1;margin:0}.layout>.panel>h2{display:none}.table-wrap{overflow:visible!important;border:0!important;border-radius:0!important;background:#fff!important}table,tbody{display:block!important;width:100%!important;min-width:0!important;border:0!important}tbody{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:.28in;align-content:start}tr{display:grid!important;grid-template-columns:.18in minmax(0,1fr) auto;align-items:start;break-inside:avoid;page-break-inside:avoid;border:0!important;border-bottom:.5pt solid #000!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;padding:0!important;min-height:.23in}td{display:block!important;width:auto!important;border:0!important;padding:2pt 2pt!important;overflow-wrap:anywhere}td:first-child{grid-column:auto!important;grid-row:auto!important;padding-left:0!important;padding-top:2pt!important}td:nth-child(2),td:nth-child(3){grid-column:auto!important}td:nth-child(2){min-width:0}td:nth-child(3){max-width:1.25in;text-align:right;white-space:normal;font-weight:700;padding-right:0!important;color:#000!important}td:nth-child(4),td:nth-child(5){display:none!important}td strong{font-weight:600}input[type=checkbox]{appearance:none;-webkit-appearance:none;width:.15in!important;height:.15in!important;margin:0;border:1pt solid #000;border-radius:0;background:#fff;vertical-align:top}.bought td:not(:first-child){opacity:1;text-decoration:line-through}.empty{padding:12pt 0!important;text-align:left!important;color:#000!important}}

<body>
<header class="wrap"><section class="hero"><h1>Shopping List</h1><p class="muted">Selected recipes are combined into one ingredient list. Sign in with the same email on each device to share the list.</p><nav class="nav"><a class="button" href="./">← Recipe Book</a><button id="print" class="button primary">Print</button><button id="clear" class="button danger" disabled>Clear List</button></nav></section></header>
<div class="wrap"><section class="panel auth-panel"><div id="signedOut"><h2>Sign in to sync</h2><form id="loginForm" class="auth-form"><input id="email" type="email" autocomplete="email" required placeholder="Your email address"><button class="primary" type="submit">Email Login Link</button></form></div><div id="signedIn" class="hidden"><div class="auth-actions"><strong id="account"></strong><button id="signOut" type="button">Sign Out</button></div></div><p id="syncStatus" class="status muted">Sign in to load your shared list.</p></section></div>
<main class="wrap layout"><section class="panel selector"><h2>Select Recipes</h2><input id="search" type="search" placeholder="Search recipes…"><div id="recipes" class="recipe-list"><div class="empty">Loading…</div></div></section><section class="panel"><h2>Your Ingredients</h2><form id="manualForm" class="manual-form"><input id="manualName" required placeholder="Ingredient name" aria-label="Ingredient name"><input id="manualAmount" placeholder="Amount, e.g. 2 cups" aria-label="Ingredient amount"><select id="manualType" aria-label="Ingredient type"><option>Produce</option><option>Meat & Seafood</option><option>Dairy & Eggs</option><option>Pantry</option><option>Baking</option><option>Spices & Seasonings</option><option>Canned & Jarred</option><option>Frozen</option><option selected>Other</option></select><button class="primary" type="submit" disabled>Add Ingredient</button></form><div id="summary" class="summary"></div><details id="filters" class="filters"><summary>Filters</summary><div class="filter-grid"><label>Recipe<select id="recipeFilter"><option value="all">All selected recipes</option></select></label><label>Ingredient<input id="ingredientFilter" type="search" placeholder="Search ingredients…"></label><label>Ingredient type<select id="typeFilter"><option value="all">All ingredient types</option><option>Produce</option><option>Meat & Seafood</option><option>Dairy & Eggs</option><option>Pantry</option><option>Baking</option><option>Spices & Seasonings</option><option>Canned & Jarred</option><option>Frozen</option><option>Other</option></select></label></div></details><div id="list"><div class="empty">Sign in to load your shopping list.</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://seaadqpniwtfcrapeepw.supabase.co';
const SUPABASE_KEY='sb_publishable_UMrA0peLcE5Fx8iW7D_FYg_d22oxXdI';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function localJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
const state={recipes:[],selected:new Set(),removed:new Set(),edits:{},manual:[],checked:new Set(),typeFilter:localStorage.getItem('shoppingTypeFilter')||'all',recipeFilter:localStorage.getItem('shoppingRecipeFilter')||'all',ingredientFilter:localStorage.getItem('shoppingIngredientFilter')||'',user:null,ready:false,saving:false,saveTimer:null};
function setStatus(message){$('#syncStatus').textContent=message}
function setEnabled(enabled){document.querySelectorAll('.recipe-option input,#manualForm button,#manualForm input,#manualForm select').forEach(x=>x.disabled=!enabled);$('#clear').disabled=!enabled}
function payload(){return{selected:[...state.selected],removed:[...state.removed],edits:state.edits,manual:state.manual,checked:[...state.checked]}}
function applyPayload(data={}){state.selected=new Set(data.selected||[]);state.removed=new Set(data.removed||[]);state.edits=data.edits||{};state.manual=data.manual||[];state.checked=new Set(data.checked||[])}
function localPayload(){return{selected:localJson('shoppingRecipes',[]),removed:localJson('shoppingRemovedIngredients',[]),edits:localJson('shoppingIngredientEdits',{}),manual:localJson('shoppingManualIngredients',[]),checked:localJson('shoppingCheckedIngredients',[])}}
function hasLocalData(data){return data.selected.length||data.removed.length||Object.keys(data.edits).length||data.manual.length||data.checked.length}
function clearLegacyLocal(){['shoppingRecipes','shoppingRemovedIngredients','shoppingIngredientEdits','shoppingManualIngredients','shoppingCheckedIngredients'].forEach(k=>localStorage.removeItem(k))}
async function saveShared(){if(!state.user||!state.ready)return;state.saving=true;setStatus('Saving…');const{error}=await db.from('shopping_lists').upsert({user_id:state.user.id,list_data:payload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});state.saving=false;setStatus(error?'Could not save. Please try again.':'Saved and synced.');if(error)console.error(error)}
function queueSave(){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(saveShared,250)}
async function loadShared(){const{data,error}=await db.from('shopping_lists').select('list_data').eq('user_id',state.user.id).maybeSingle();if(error){setStatus('Could not load your shared list.');console.error(error);return}const local=localPayload();if(data?.list_data)applyPayload(data.list_data);else if(hasLocalData(local)){applyPayload(local);state.ready=true;await saveShared();clearLegacyLocal()}else applyPayload({});state.ready=true;setEnabled(true);renderRecipes();renderList();setStatus('Saved and synced.')}
function normaliseIngredient(raw){const line=String(raw||'').trim().replace(/^[-*]\s*/,'');const match=line.match(/^(.+?)\s+[—–-]\s+(.+)$/);return match?{name:match[1].trim(),amount:match[2].trim()}:{name:line,amount:''}}
function guessType(name){const n=name.toLowerCase();if(/onion|lettuce|tomato|apple|banana|carrot|celery|cabbage|cucumber|pepper|potato|lemon|lime|garlic|zucchini|squash/.test(n))return'Produce';if(/chicken|beef|pork|sausage|bacon|fish|shrimp|turkey/.test(n))return'Meat & Seafood';if(/cheese|milk|cream|yogurt|egg|butter/.test(n))return'Dairy & Eggs';if(/flour|sugar|oat|vanilla|baking|cocoa|chocolate/.test(n))return'Baking';if(/salt|pepper|paprika|cinnamon|seasoning|spice|herb/.test(n))return'Spices & Seasonings';if(/can|canned|tomato sauce|beans|broth/.test(n))return'Canned & Jarred';if(/frozen/.test(n))return'Frozen';return'Pantry'}
function recipeId(r){return r.id||r.path||r.title}
function recipeTitle(r){return r.title||r.name||r.id||'Untitled Recipe'}
function sourcePath(r){return r.path||r.file||r.url||''}
async function loadRecipes(){try{const res=await fetch('./recipes/recipes.json',{cache:'no-store'});if(!res.ok)throw new Error('recipes.json unavailable');const data=await res.json();state.recipes=Array.isArray(data)?data:(data.recipes||[]);renderRecipes();renderList()}catch(error){$('#recipes').innerHTML='<div class="empty">Could not load recipes.</div>';console.error(error)}}
function renderRecipes(){const q=$('#search').value.trim().toLowerCase();const items=state.recipes.filter(r=>recipeTitle(r).toLowerCase().includes(q));$('#recipes').innerHTML=items.length?items.map(r=>{const id=recipeId(r);return`<label class="recipe-option"><input type="checkbox" data-recipe="${esc(id)}" ${state.selected.has(id)?'checked':''} ${state.ready?'':'disabled'}><span><strong>${esc(recipeTitle(r))}</strong><small>${esc(r.category||r.course||'Recipe')}</small></span></label>`}).join(''):'<div class="empty">No matching recipes.</div>'}
function ingredientKey(recipe,name,index){return`${recipe}::${name}::${index}`}
async function collectIngredients(){const output=[];for(const r of state.recipes.filter(r=>state.selected.has(recipeId(r)))){let ingredients=Array.isArray(r.ingredients)?r.ingredients:null;if(!ingredients&&sourcePath(r)){try{const res=await fetch(sourcePath(r));const text=await res.text();const section=(text.match(/##?\s*Ingredients([\s\S]*?)(?=\n##?\s|$)/i)||[])[1]||'';ingredients=section.split('\n').filter(x=>/^\s*[-*]/.test(x))}catch{ingredients=[]}}(ingredients||[]).forEach((raw,index)=>{const parsed=typeof raw==='string'?normaliseIngredient(raw):{name:raw.name||raw.ingredient||'',amount:raw.amount||raw.quantity||''};const key=ingredientKey(recipeId(r),parsed.name,index);if(state.removed.has(key))return;const edit=state.edits[key]||{};output.push({key,name:edit.name||parsed.name,amount:edit.amount??parsed.amount,type:edit.type||guessType(parsed.name),from:recipeTitle(r),manual:false})})}state.manual.forEach((item,index)=>output.push({...item,key:item.key||`manual::${index}`,manual:true,from:item.from||'Manual'}));return output}
function visibleItems(items){return items.filter(item=>(state.typeFilter==='all'||item.type===state.typeFilter)&&(state.recipeFilter==='all'||item.from===state.recipeFilter)&&(!state.ingredientFilter||item.name.toLowerCase().includes(state.ingredientFilter.toLowerCase())))}
async function renderList(){const items=await collectIngredients();const visible=visibleItems(items);const recipes=[...new Set(items.map(x=>x.from).filter(x=>x!=='Manual'))].sort();$('#recipeFilter').innerHTML='<option value="all">All selected recipes</option>'+recipes.map(x=>`<option ${state.recipeFilter===x?'selected':''}>${esc(x)}</option>`).join('');$('#typeFilter').value=state.typeFilter;$('#ingredientFilter').value=state.ingredientFilter;$('#summary').innerHTML=`<span class="pill">${items.length} ingredients</span><span class="pill">${state.selected.size} recipes</span>`;if(!state.user){$('#list').innerHTML='<div class="empty">Sign in to load your shopping list.</div>';return}if(!visible.length){$('#list').innerHTML='<div class="empty">No ingredients match the current filters.</div>';return}$('#list').innerHTML=`<div class="table-wrap"><table><thead><tr><th class="check-col"></th><th class="ingredient-col">Ingredient</th><th class="amount-col">Amount</th><th class="from-col">Recipe</th><th class="actions-col">Actions</th></tr></thead><tbody>${visible.map(item=>`<tr class="${state.checked.has(item.key)?'bought':''}" data-key="${esc(item.key)}"><td><input type="checkbox" data-check="${esc(item.key)}" ${state.checked.has(item.key)?'checked':''}></td><td><strong>${esc(item.name)}</strong><small>${esc(item.type)}</small></td><td data-type="${esc(item.type)}">${esc(item.amount||'—')}</td><td>${esc(item.from)}</td><td><div class="row-actions"><button class="small" data-edit="${esc(item.key)}">Edit</button><button class="small danger" data-remove="${esc(item.key)}">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`}
function findItem(key){return collectIngredients().then(items=>items.find(x=>x.key===key))}
$('#recipes').addEventListener('change',e=>{const id=e.target.dataset.recipe;if(!id)return;e.target.checked?state.selected.add(id):state.selected.delete(id);queueSave();renderList()});
$('#search').addEventListener('input',renderRecipes);
$('#typeFilter').addEventListener('change',e=>{state.typeFilter=e.target.value;localStorage.setItem('shoppingTypeFilter',state.typeFilter);renderList()});
$('#recipeFilter').addEventListener('change',e=>{state.recipeFilter=e.target.value;localStorage.setItem('shoppingRecipeFilter',state.recipeFilter);renderList()});
$('#ingredientFilter').addEventListener('input',e=>{state.ingredientFilter=e.target.value;localStorage.setItem('shoppingIngredientFilter',state.ingredientFilter);renderList()});
$('#list').addEventListener('change',e=>{const key=e.target.dataset.check;if(!key)return;e.target.checked?state.checked.add(key):state.checked.delete(key);queueSave();renderList()});
$('#list').addEventListener('click',async e=>{const remove=e.target.dataset.remove,edit=e.target.dataset.edit;if(remove){if(remove.startsWith('manual::'))state.manual=state.manual.filter((x,i)=>(x.key||`manual::${i}`)!==remove);else state.removed.add(remove);queueSave();renderList()}if(edit){const item=await findItem(edit);if(!item)return;const row=e.target.closest('tr');row.innerHTML=`<td></td><td colspan="4"><div class="edit-grid"><input data-edit-name value="${esc(item.name)}"><input data-edit-amount value="${esc(item.amount)}"><input data-edit-type value="${esc(item.type)}"><div class="row-actions"><button class="small primary" data-save-edit="${esc(edit)}">Save</button><button class="small" data-cancel-edit>Cancel</button></div></div></td>`}});
$('#list').addEventListener('click',e=>{const key=e.target.dataset.saveEdit;if(key){const row=e.target.closest('tr'),value={name:row.querySelector('[data-edit-name]').value.trim(),amount:row.querySelector('[data-edit-amount]').value.trim(),type:row.querySelector('[data-edit-type]').value.trim()||'Other'};if(key.startsWith('manual::')){const index=state.manual.findIndex((x,i)=>(x.key||`manual::${i}`)===key);if(index>=0)state.manual[index]={...state.manual[index],...value,key}}else state.edits[key]=value;queueSave();renderList()}if(e.target.dataset.cancelEdit!==undefined)renderList()});
$('#manualForm').addEventListener('submit',e=>{e.preventDefault();const key=`manual::${Date.now()}`;state.manual.push({key,name:$('#manualName').value.trim(),amount:$('#manualAmount').value.trim(),type:$('#manualType').value,from:'Manual'});e.target.reset();$('#manualType').value='Other';queueSave();renderList()});
$('#clear').addEventListener('click',()=>{if(!confirm('Clear the entire shopping list?'))return;applyPayload({});queueSave();renderRecipes();renderList()});
$('#print').addEventListener('click',()=>window.print());
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();setStatus('Sending login link…');const email=$('#email').value.trim();const{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});setStatus(error?'Could not send login link.':'Check your email for the login link.');if(error)console.error(error)});
$('#signOut').addEventListener('click',()=>db.auth.signOut());
async function setSession(session){state.user=session?.user||null;state.ready=false;$('#signedOut').classList.toggle('hidden',!!state.user);$('#signedIn').classList.toggle('hidden',!state.user);$('#account').textContent=state.user?.email||'';setEnabled(false);if(state.user)await loadShared();else{applyPayload({});renderRecipes();renderList();setStatus('Sign in to load your shared list.')}}
db.auth.onAuthStateChange((_event,session)=>setSession(session));db.auth.getSession().then(({data})=>setSession(data.session));loadRecipes();
</script>
</body>
</html>
