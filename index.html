<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calvin's Recipe Book</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#2c211b;--muted:#75645a;--accent:#914b2c;--soft:#f3dfcf;--line:#e2cfb8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#f3e5cf);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}header{padding:48px 0 24px}.hero{padding:36px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.82);box-shadow:0 20px 50px #57311618}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2.5rem,8vw,5rem);line-height:1}.hero p{max-width:680px;color:var(--muted)}.eyebrow{color:var(--accent);font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}input{width:100%;margin:24px 0 0;padding:15px 18px;border:1px solid var(--line);border-radius:999px;background:white;font:inherit}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 18px}.section-title{margin:0;font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.2rem)}.back{display:none;border:1px solid var(--line);border-radius:999px;background:white;padding:9px 14px;font:inherit;cursor:pointer}.category-grid,.recipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;padding-bottom:50px}.category-card,.recipe-card{border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 28px #57311610;color:inherit;text-align:left;cursor:pointer;transition:.15s ease}.category-card{min-height:205px;padding:24px;display:flex;flex-direction:column;justify-content:space-between}.category-card:hover,.category-card:focus-visible,.recipe-card:hover,.recipe-card:focus-visible{transform:translateY(-2px);box-shadow:0 16px 32px #57311618}.category-icon{font-size:2.3rem}.category-card h2,.recipe-card h2{margin:8px 0;font-family:Georgia,serif}.category-card p,.desc{margin:0;color:var(--muted)}.count{display:inline-block;width:max-content;margin-top:18px;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 10px;color:var(--accent);font-size:.78rem;font-weight:800}.recipe-card{padding:22px}.recipe-type{color:var(--accent);font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.empty{grid-column:1/-1;padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px;background:#ffffff88}dialog{width:min(820px,calc(100% - 24px));max-height:calc(100vh - 24px);border:0;border-radius:22px;padding:0;background:var(--bg)}dialog::backdrop{background:#241a15aa}.bar{position:sticky;top:0;text-align:right;padding:12px;background:#fff8edee;border-bottom:1px solid var(--line)}.bar button{border:1px solid var(--line);border-radius:999px;background:white;padding:9px 14px;cursor:pointer}.body{padding:30px}.body h1{font-size:2.7rem}.body h2{font-family:Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:5px}.body code{font-family:inherit;background:var(--soft);border-radius:5px;padding:1px 5px;color:var(--accent)}footer{text-align:center;color:var(--muted);padding:0 0 40px}@media(max-width:600px){header{padding-top:20px}.hero{padding:26px}.body{padding:22px}.category-grid,.recipe-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="wrap"><section class="hero"><div class="eyebrow">Personal Recipe Collection</div><h1>Calvin's Recipe Book</h1><p>Browse Breakfast, Lunch, Dinner, Sides, and Sweets, or search the full recipe collection.</p></section><input id="search" type="search" placeholder="Search recipes or ingredients…" aria-label="Search recipes"></header>
<main class="wrap"><div class="topline"><h2 id="view-title" class="section-title">Recipe Categories</h2><button id="back" class="back" type="button">← Categories</button></div><div id="content" class="category-grid"></div></main>
<footer class="wrap">PersonalRecipeDB · Built with GitHub Pages</footer>
<dialog id="recipe"><div class="bar"><button id="close">Close</button></div><article id="body" class="body"></article></dialog>
<script>
const content=document.querySelector('#content');
const search=document.querySelector('#search');
const dialog=document.querySelector('#recipe');
const body=document.querySelector('#body');
const title=document.querySelector('#view-title');
const back=document.querySelector('#back');
const categories=[
  {name:'Breakfast',icon:'☀️',description:'Morning meals, eggs, baked breakfasts, and make-ahead options.'},
  {name:'Lunch',icon:'🥪',description:'Packable meals, salads, bowls, sandwiches, and lighter soups.'},
  {name:'Dinner',icon:'🍽️',description:'Main dishes, hearty soups, casseroles, and evening meals.'},
  {name:'Sides',icon:'🥔',description:'Vegetables, salads, potatoes, breads, and dishes served alongside a meal.'},
  {name:'Sweets',icon:'🍰',description:'Desserts, cookies, cakes, pies, candies, and other sweet treats.'}
];
let recipes=[];
let activeCategory=null;
function esc(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}
function inlineMd(text=''){return esc(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}
function mealCategory(recipe){if(recipe.mealCategory)return recipe.mealCategory;if(recipe.category==='Side Dish')return 'Sides';if(recipe.category==='Soup')return 'Dinner';if(['Dessert','Desserts','Sweet','Sweets'].includes(recipe.category))return 'Sweets';return recipe.category||'Dinner'}
function md(text){return text.split('\n').map(line=>{if(line.startsWith('# '))return `<h1>${inlineMd(line.slice(2))}</h1>`;if(line.startsWith('## '))return `<h2>${inlineMd(line.slice(3))}</h2>`;if(line.startsWith('### '))return `<h3>${inlineMd(line.slice(4))}</h3>`;if(/^\d+\. /.test(line))return `<p>${inlineMd(line)}</p>`;if(line.startsWith('- '))return `<p>• ${inlineMd(line.slice(2))}</p>`;return line.trim()?`<p>${inlineMd(line)}</p>`:''}).join('')}
function recipeCards(list){if(!list.length)return '<div class="empty">No recipes have been added to this category yet.</div>';return list.map((recipe,index)=>`<button class="recipe-card" data-index="${index}" type="button"><div class="recipe-type">${esc(recipe.category||'Recipe')}</div><h2>${esc(recipe.title)}</h2><p class="desc">${esc(recipe.description||'Open recipe')}</p></button>`).join('')}
function showCategories(){activeCategory=null;title.textContent='Recipe Categories';back.style.display='none';content.className='category-grid';content.innerHTML=categories.map((category,index)=>{const count=recipes.filter(recipe=>mealCategory(recipe)===category.name).length;return `<button class="category-card" data-category="${index}" type="button"><div><div class="category-icon">${category.icon}</div><h2>${esc(category.name)}</h2><p>${esc(category.description)}</p></div><span class="count">${count} ${count===1?'recipe':'recipes'}</span></button>`}).join('');content.querySelectorAll('.category-card').forEach(button=>button.addEventListener('click',()=>showCategory(categories[Number(button.dataset.category)].name)))}
function showCategory(name){activeCategory=name;title.textContent=name;back.style.display='inline-block';content.className='recipe-grid';const shown=recipes.filter(recipe=>mealCategory(recipe)===name);content.innerHTML=recipeCards(shown);content.querySelectorAll('.recipe-card').forEach(button=>button.addEventListener('click',()=>openRecipe(shown[Number(button.dataset.index)])))}
function showSearch(query){activeCategory=null;title.textContent=`Search Results`;back.style.display='inline-block';content.className='recipe-grid';const shown=recipes.filter(recipe=>JSON.stringify(recipe).toLowerCase().includes(query));content.innerHTML=shown.length?recipeCards(shown):'<div class="empty">No recipes match that search.</div>';content.querySelectorAll('.recipe-card').forEach(button=>button.addEventListener('click',()=>openRecipe(shown[Number(button.dataset.index)])))}
async function openRecipe(recipe){try{const response=await fetch(`${recipe.file}?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);body.innerHTML=md(await response.text());dialog.showModal()}catch{body.innerHTML='<h1>Recipe unavailable</h1><p>The recipe file could not be opened.</p>';dialog.showModal()}}
search.addEventListener('input',()=>{const query=search.value.toLowerCase().trim();query?showSearch(query):showCategories()});
back.addEventListener('click',()=>{search.value='';showCategories()});
document.querySelector('#close').addEventListener('click',()=>dialog.close());
fetch(`recipes/index.json?v=${Date.now()}`,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(data=>{recipes=Array.isArray(data)?data:[];showCategories()}).catch(()=>{content.innerHTML='<div class="empty">The recipe list could not be loaded. Refresh the page and try again.</div>'});
</script>
</body>
</html>
