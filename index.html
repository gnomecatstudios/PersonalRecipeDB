<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calvin's Recipe Book</title>
<style>
:root{--bg:#fff8ed;--card:#fff;--ink:#2c211b;--muted:#75645a;--accent:#914b2c;--soft:#f3dfcf;--line:#e2cfb8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8ed,#f3e5cf);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.5}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}header{padding:48px 0 24px}.hero{padding:36px;border:1px solid var(--line);border-radius:28px;background:#ffffffd1;box-shadow:0 20px 50px #57311618}h1{margin:0;font-family:Georgia,serif;font-size:clamp(2.5rem,8vw,5rem);line-height:1}.hero p,.desc{color:var(--muted)}.eyebrow,.recipe-type{color:var(--accent);font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}input{width:100%;margin-top:24px;padding:15px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 18px}.section-title{margin:0;font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.2rem)}.back{display:none;border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 14px;font:inherit;cursor:pointer}.category-grid,.recipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;padding-bottom:50px}.category-card,.recipe-card{border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 28px #57311610;color:inherit;text-align:left;cursor:pointer}.category-card{min-height:205px;padding:24px;display:flex;flex-direction:column;justify-content:space-between}.recipe-card{padding:22px}.category-icon{font-size:2.3rem}.category-card h2,.recipe-card h2{margin:8px 0;font-family:Georgia,serif}.count{display:inline-block;width:max-content;margin-top:18px;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 10px;color:var(--accent);font-size:.78rem;font-weight:800}.empty{grid-column:1/-1;padding:42px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:20px;background:#ffffff88}dialog{width:min(820px,calc(100% - 24px));max-height:calc(100vh - 24px);border:0;border-radius:22px;padding:0;background:var(--bg)}dialog::backdrop{background:#241a15aa}.bar{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;padding:12px;background:#fff8edee;border-bottom:1px solid var(--line)}.bar button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 14px;cursor:pointer}#print{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.body{padding:30px}.body h1{font-size:2.7rem}.body h2{font-family:Georgia,serif;border-bottom:1px solid var(--line);padding-bottom:5px}.body code{font-family:inherit;background:var(--soft);border-radius:5px;padding:1px 5px;color:var(--accent)}.body ul,.body ol{padding-left:1.35rem}.print-meta,.print-page{display:none}footer{text-align:center;color:var(--muted);padding-bottom:40px}@media(max-width:600px){header{padding-top:20px}.hero{padding:26px}.body{padding:22px}.category-grid,.recipe-grid{grid-template-columns:1fr}}
@page{size:6in 4in landscape;margin:.25in .30in}@media print{html,body{background:#fff;color:#000}body>*:not(dialog){display:none!important}dialog,dialog[open]{display:block!important;position:static!important;width:auto!important;max-width:none!important;height:auto!important;max-height:none!important;margin:0!important;padding:0!important;border:0!important;overflow:visible!important;background:#fff!important}.bar{display:none!important}.body{padding:0!important;font-family:Arial,sans-serif;font-size:8pt;line-height:1.12}.body>h1{display:none!important}.print-page{display:block!important;position:relative;width:100%;height:3.5in;overflow:hidden;break-after:page;page-break-after:always}.print-page:last-child{break-after:auto;page-break-after:auto}.card-header{margin-bottom:4pt}.card-header h1{display:block!important;margin:0 0 3pt;font-family:Georgia,serif;font-size:14pt;line-height:1.02;border-bottom:1.1pt solid #000;padding-bottom:2.5pt}.print-meta{display:flex!important;gap:16pt;margin-bottom:4pt;font-size:7.7pt}.body h2{margin:4pt 0 2pt;font-family:Georgia,serif;font-size:10pt;line-height:1.02;border-bottom:.6pt solid #777;padding-bottom:1.5pt}.body h3{margin:3pt 0 1pt;font-size:8.2pt}.body ul,.body ol{margin:0 0 2pt;padding-left:13pt}.body li{margin:0 0 .8pt;break-inside:avoid}.ingredient-columns{column-count:2;column-gap:.24in;column-fill:auto}.ingredients-page.dense{font-size:7.4pt;line-height:1.06}.ingredients-page.very-dense{font-size:6.8pt;line-height:1.02}.instructions-page{font-size:7.6pt;line-height:1.08;padding-right:.72in}.instructions-page.dense{font-size:7pt;line-height:1.04}.instructions-page.very-dense{font-size:6.5pt;line-height:1.01}.qr-box{position:absolute;right:0;bottom:0;width:.68in;text-align:center;font-size:5.8pt;line-height:1.05;background:#fff}.qr-box img{display:block;width:.62in;height:.62in;margin:0 auto 2pt}.print-omit{display:none!important}}
</style></head><body>
<header class="wrap"><section class="hero"><div class="eyebrow">Personal Recipe Collection</div><h1>Calvin's Recipe Book</h1><p>Browse by category or search recipes and ingredients.</p></section><input id="search" type="search" placeholder="Search recipes or ingredients…"></header><main class="wrap"><div class="topline"><h2 id="view-title" class="section-title">Recipe Categories</h2><button id="back" class="back">← Categories</button></div><div id="content" class="category-grid"></div></main><footer class="wrap">PersonalRecipeDB · Built with GitHub Pages</footer><dialog id="recipe"><div class="bar"><button id="print">Print 4×6</button><button id="close">Close</button></div><article id="body" class="body"></article></dialog>
<script>
const content=document.querySelector('#content'),search=document.querySelector('#search'),dialog=document.querySelector('#recipe'),body=document.querySelector('#body'),title=document.querySelector('#view-title'),back=document.querySelector('#back');const categories=[{name:'Breakfast',icon:'☀️'},{name:'Lunch',icon:'🥪'},{name:'Dinner',icon:'🍽️'},{name:'Sides',icon:'🥔'},{name:'Sweets',icon:'🍰'}];let recipes=[];const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function mealCategory(r){if(r.mealCategory)return r.mealCategory;if(r.category==='Side Dish')return'Sides';if(r.category==='Soup')return'Dinner';if(['Dessert','Desserts','Sweet','Sweets'].includes(r.category))return'Sweets';return r.category||'Dinner'}function inlineMd(t=''){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>')}function md(text){let html='',list='';const close=()=>{if(list){html+=`</${list}>`;list=''}};for(const line of text.split('\n')){if(line.startsWith('# ')){close();html+=`<h1>${inlineMd(line.slice(2))}</h1>`}else if(line.startsWith('## ')){close();html+=`<h2>${inlineMd(line.slice(3))}</h2>`}else if(line.startsWith('### ')){close();html+=`<h3>${inlineMd(line.slice(4))}</h3>`}else if(/^\d+\. /.test(line)){if(list!=='ol'){close();list='ol';html+='<ol>'}html+=`<li>${inlineMd(line.replace(/^\d+\. /,''))}</li>`}else if(line.startsWith('- ')){if(list!=='ul'){close();list='ul';html+='<ul>'}html+=`<li>${inlineMd(line.slice(2))}</li>`}else{close();if(line.trim())html+=`<p>${inlineMd(line)}</p>`}}close();return html}
function preparePrintCard(r){body.querySelectorAll('.print-page').forEach(e=>e.remove());body.querySelectorAll('.print-omit').forEach(e=>e.classList.remove('print-omit'));const main=body.querySelector('h1'),first=body.querySelector('h2');let servings='—';for(let e=main?.nextElementSibling;e&&e!==first;e=e.nextElementSibling){const m=e.textContent.trim().match(/^(?:Yield|Servings):\s*(.+)$/i);if(m)servings=m[1].replace(/\s+servings?$/i,'').trim();e.classList.add('print-omit')}body.querySelectorAll('h2').forEach(h=>{const s=h.textContent.trim().toLowerCase();if(s==='ingredients'||s==='instructions')return;h.classList.add('print-omit');for(let e=h.nextElementSibling;e&&e.tagName!=='H2';e=e.nextElementSibling)e.classList.add('print-omit')});const ih=[...body.querySelectorAll('h2')].find(h=>h.textContent.trim().toLowerCase()==='ingredients'),sh=[...body.querySelectorAll('h2')].find(h=>h.textContent.trim().toLowerCase()==='instructions');if(!ih||!sh)return;const header=()=>{const d=document.createElement('div');d.className='card-header';d.innerHTML=`<h1>${esc(main?.textContent||r.title)}</h1><div class="print-meta"><span><strong>ID:</strong> ${esc(r.id||'—')}</span><span><strong>Servings:</strong> ${esc(servings)}</span></div>`;return d};const ip=document.createElement('section');ip.className='print-page ingredients-page';ip.append(header());const cols=document.createElement('div');cols.className='ingredient-columns';for(let n=ih;n&&n!==sh;){const next=n.nextElementSibling;cols.append(n);n=next}ip.append(cols);const ic=cols.querySelectorAll('li').length;if(ic>18)ip.classList.add('dense');if(ic>26)ip.classList.add('very-dense');const sp=document.createElement('section');sp.className='print-page instructions-page';sp.append(header());for(let n=sh;n;){const next=n.nextElementSibling;if(n!==sh&&n.tagName==='H2')break;sp.append(n);n=next}const count=sp.querySelectorAll('li').length,len=sp.textContent.length;if(count>8||len>1150)sp.classList.add('dense');if(count>12||len>1700)sp.classList.add('very-dense');const url=`${location.origin}${location.pathname}?recipe=${encodeURIComponent(r.id)}`;const qr=document.createElement('div');qr.className='qr-box';qr.innerHTML=`<img alt="QR code for full digital recipe" src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(url)}"><span>Full recipe & extra instructions</span>`;sp.append(qr);body.prepend(sp);body.prepend(ip);main?.classList.add('print-omit')}
function text(r,m=''){return[r.id,r.title,r.mealCategory,r.category,r.description,...(r.tags||[]),m].filter(Boolean).join(' ').toLowerCase()}async function hydrate(r){try{const x=await fetch(`${r.file}?v=${Date.now()}`,{cache:'no-store'}),m=await x.text();return{...r,markdown:m,searchText:text(r,m)}}catch{return{...r,markdown:'',searchText:text(r)}}}function cards(list){return list.length?list.map((r,i)=>`<button class="recipe-card" data-i="${i}"><div class="recipe-type">${esc(r.category||'Recipe')}</div><h2>${esc(r.title)}</h2><p class="desc">${esc(r.description||'Open recipe')}</p></button>`).join(''):'<div class="empty">No recipes found.</div>'}function wire(list){content.querySelectorAll('.recipe-card').forEach(b=>b.onclick=()=>openRecipe(list[+b.dataset.i]))}function showCategories(){title.textContent='Recipe Categories';back.style.display='none';content.className='category-grid';content.innerHTML=categories.map((c,i)=>`<button class="category-card" data-i="${i}"><div><div class="category-icon">${c.icon}</div><h2>${c.name}</h2></div><span class="count">${recipes.filter(r=>mealCategory(r)===c.name).length} recipes</span></button>`).join('');content.querySelectorAll('.category-card').forEach(b=>b.onclick=()=>showCategory(categories[+b.dataset.i].name))}function showCategory(name){title.textContent=name;back.style.display='inline-block';content.className='recipe-grid';const list=recipes.filter(r=>mealCategory(r)===name);content.innerHTML=cards(list);wire(list)}function showSearch(q){title.textContent='Search Results';back.style.display='inline-block';content.className='recipe-grid';const list=recipes.filter(r=>q.split(/\s+/).every(t=>r.searchText.includes(t)));content.innerHTML=cards(list);wire(list)}async function openRecipe(r){let m=r.markdown;if(!m){const x=await fetch(r.file);m=await x.text()}body.innerHTML=md(m);preparePrintCard(r);dialog.showModal();history.replaceState(null,'',`?recipe=${encodeURIComponent(r.id)}`)}search.oninput=()=>search.value.trim()?showSearch(search.value.toLowerCase().trim()):showCategories();back.onclick=()=>{search.value='';showCategories()};document.querySelector('#close').onclick=()=>{dialog.close();history.replaceState(null,'',location.pathname)};document.querySelector('#print').onclick=()=>window.print();fetch(`recipes/index.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).then(async data=>{recipes=await Promise.all(data.map(hydrate));showCategories();const id=new URLSearchParams(location.search).get('recipe');const found=recipes.find(r=>r.id===id);if(found)openRecipe(found)}).catch(()=>content.innerHTML='<div class="empty">The recipe list could not be loaded.</div>');
</script></body></html>
